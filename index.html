<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JGVRP Hologram Speedometer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="speedoContainer" class="holo-wrapper">
    <div class="holo-hud">
      <!-- Baris Atas: Angka Kecepatan 3 Digit Bersih (Tanpa HBK & ABS) -->
      <div class="top-row">
        <div class="speed-box">
          <span id="speedValue" class="speed-fg">014</span>
        </div>
      </div>

      <!-- Baris Tengah: Sein Kiri, GEAR 1, Sein Kanan & KPH -->
      <div class="mid-row">
        <div class="gear-turn-group">
          <span id="indLeft" class="turn-arrow dim">&#9664;</span>
          <span id="gearValue" class="gear-text">GEAR 1</span>
          <span id="indRight" class="turn-arrow dim">&#9654;</span>
        </div>
        <span id="unitValue" class="unit-text">KPH</span>
      </div>

      <!-- Garis RPM Putih Tunggal -->
      <div class="rpm-track">
        <div id="rpmFill" class="rpm-fill" style="width: 24%;"></div>
      </div>

      <!-- Baris Bawah Minimalis: BELT, LAMP, FUEL & ENG -->
      <div class="mini-status-row">
        <div class="mini-group">
          <span id="indBelt" class="ind-text warn">BELT</span>
          <span id="indLamp" class="ind-text dim">LAMP</span>
        </div>
        <div class="mini-group">
          <span class="mini-stat cyan">FUEL <b id="fuelText">100%</b></span>
          <span id="engLabel" class="mini-stat green">ENG <b id="healthText">100%</b></span>
        </div>
      </div>
      <div id="odoText" class="odo-mini">0000.0 MI</div>
    </div>
  </div>

  <audio id="seatbeltSound" preload="auto"></audio>
  <script src="script.js"></script>
</body>
</html>
